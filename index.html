<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Mobile Website</title>
      <style>
          body {
                font-family: system-ui, sans-serif;
                      background: #0f172a;
                            color: white;
                                  display: flex;
                                        flex-direction: column;
                                              align-items: center;
                                                    justify-content: center;
                                                          min-height: 90vh;
                                                                margin: 0;
                                                                      text-align: center;
                                                                            padding: 20px;
                                                                                }
                                                                                    .card {
                                                                                          background: #1e293b;
                                                                                                padding: 30px;
                                                                                                      border-radius: 16px;
                                                                                                            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
                                                                                                                  max-width: 320px;
                                                                                                                      }
                                                                                                                          button {
                                                                                                                                background: #38bdf8;
                                                                                                                                      border: none;
                                                                                                                                            padding: 12px 24px;
                                                                                                                                                  color: #0f172a;
                                                                                                                                                        font-weight: bold;
                                                                                                                                                              border-radius: 8px;
                                                                                                                                                                    cursor: pointer;
                                                                                                                                                                          margin-top: 15px;
                                                                                                                                                                              }
                                                                                                                                                                                </style>
                                                                                                                                                                                </head>
                                                                                                                                                                                <body>

                                                                                                                                                                                  <div class="card">
                                                                                                                                                                                      <h2>🎉 It Works!</h2>
                                                                                                                                                                                          <p>This website was coded entirely from a mobile phone using GitHub Codespaces.</p>
                                                                                                                                                                                              <button onclick="alert('Hello from your phone!')">Tap Me</button>
                                                                                                                                                                                                </div>

                                                                                                                                                                                                </body>
                                                                                                                                                                                                </html>
